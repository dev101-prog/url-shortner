# CI for the URL shortener (design §9.1 / §9.2 gates). Humans merge; CI only verifies.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (G1-G7 - format, compile -Werror, Checkstyle, SpotBugs, tests, coverage, ArchUnit, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the runner's Docker daemon (postgres:16.4-alpine)
      - name: ./mvnw -B verify
        run: ./mvnw -B verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco-merged/
            target/spotbugsXml.xml
            target/checkstyle-result.xml
          if-no-files-found: ignore

  gitleaks:
    name: secrets (G8 - gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect (full history)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  dependency-check:
    name: dependencies (G9 - OWASP Dependency-Check, fail on CVSS >= 7)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      - name: dependency-check (security profile)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ARGS=""
          if [ -n "$NVD_API_KEY" ]; then ARGS="-DnvdApiKey=$NVD_API_KEY"; fi
          ./mvnw -B -Psecurity dependency-check:check $ARGS
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: ignore
