services:
  postgres:
    image: postgres:16.4-alpine
    container_name: urlshortener-db
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust      # LOCAL ONLY: credentials intentionally ignored (see §16.2)
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:                                       # optional: run app in Docker too
    build: .
    profiles: ["full"]
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urlshortener
      APP_BASE_URL: http://localhost:8080
    ports: ["8080:8080"]
    healthcheck:                             # same probe as the Dockerfile HEALTHCHECK
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 3

  # --- test tooling (profile "test"; nothing is bind-mounted, so it works from any folder/host) ---
  newman:                                    # docker compose run --rm --build newman
    build: ./postman
    profiles: ["test"]
    depends_on: { app: { condition: service_healthy } }

  k6:                                        # docker compose run --rm --no-deps -T k6 run -e BASE_URL=http://app:8080 - < perf/k6/redirect-hit.js
    image: grafana/k6:0.54.0
    profiles: ["test"]
    depends_on: { app: { condition: service_healthy } }

volumes:
  pgdata:
